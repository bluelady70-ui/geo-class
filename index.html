<style>

sid.value=ls("sid");sname.value=ls("sname");
sid.addEventListener("input",function(){ls("sid",sid.value);});sname.addEventListener("input",function(){ls("sname",sname.value);});
if(ENDPOINT.indexOf("http")!==0){var w=document.getElementById("warn");w.hidden=false;w.textContent="제출 주소가 설정되지 않았습니다. 선생님께 알려 주세요.";}
function render(){var v=document.getElementById("view");
 if(!L){var h='<p>수업 시간에 선생님이 보여 준 <b>QR 코드</b>로 접속해 주세요. (QR로 열면 해당 차시의 활동지가 바로 열립니다)</p><div class="list">';
  LESSONS.forEach(function(x){h+='<a href="?l='+x.code+'"><small>'+x.label+'</small> '+esc(x.title)+'</a>';});v.innerHTML=h+'</div>';return;}
 var k=L.code,h='<div class="banner"><small>'+(L.sec?L.label+' 소단원 전체 · 개념 확인 퀴즈 '+L.mc.length+'문항':L.label.slice(0,-2)+' '+esc(L.stitle)+' · '+L.l+'차시')+'</small><b>'+esc(L.title)+'</b><span>교과서 '+esc(L.pages)+'</span></div>';
 if(!L.sec)h+='<div class="tabs"><button id="tab-ws" aria-pressed="'+(tab==="ws")+'">활동지</button>'+(L.mc.length?'<button id="tab-qz" aria-pressed="'+(tab==="qz")+'">개념 확인 퀴즈</button>':'')+'</div>';h+='<section class="sec">';
 if(tab==="ws"){
  L.qs.forEach(function(q,qi){var id="a-"+k+"-"+qi;h+='<div class="q"><label for="'+id+'">'+(qi+1)+'. '+esc(q.q)+'</label><div class="ctx">'+esc(q.c)+'</div>';
   q.ref.forEach(function(r){h+='<div class="ref">📎 참고 자료: '+esc(r)+'</div>';});
   h+='<textarea id="'+id+'" data-k="'+id+'">'+esc(ls(id))+'</textarea></div>';});
  h+='<div class="foot"><button class="btn" id="submit-ws">제출하기</button><button class="btn ghost" id="copy-ws">답안 복사</button><span class="status" id="stat" role="status"></span></div>';
 }else{
  L.mc.forEach(function(m,mi){var nm="m-"+k+"-"+mi,sel=ls(nm);h+='<fieldset class="mc" id="f-'+nm+'"><p>'+(mi+1)+'. '+esc(m.q)+'</p>';
   m.o.forEach(function(o,oi){h+='<label><input type="radio" name="'+nm+'" value="'+oi+'"'+(sel===String(oi)?' checked':'')+'> '+"①②③④"[oi]+' '+esc(o)+'</label>';});h+='<div class="fb"></div></fieldset>';});
  h+='<div class="foot"><button class="btn" id="grade">채점하고 제출하기</button><button class="btn ghost" id="retry">다시 풀기</button><span class="status" id="stat" role="status"></span></div>';
 }
 v.innerHTML=h+'</section>';}
function ident(){var a=sid.value.trim(),b=sname.value.trim();if(!a||!b){setStat("위쪽에 학번과 이름을 먼저 입력해 주세요.","err");sid.focus();return null;}return{sid:a,name:b};}
function setStat(t,c){var e=document.getElementById("stat");if(e){e.textContent=t;e.className="status "+(c||"");}}
function send(p){setStat("제출 중...","");
 if(ENDPOINT.indexOf("http")!==0){setStat("제출 주소가 설정되지 않았습니다.","err");return;}
 fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).then(function(r){return r.json();}).then(function(j){
  if(j&&j.ok){var t=new Date().toLocaleTimeString("ko-KR");setStat((p.type==="quiz"?"점수 "+p.score+" / "+p.total+" · ":"")+"제출 완료 ("+t+"). 다시 제출하면 최신 내용으로 바뀝니다.","ok");}else setStat("제출 실패: "+(j&&j.error||"알 수 없는 오류")+" · 다시 시도해 주세요.","err");
 }).catch(function(){setStat("제출 실패: 네트워크를 확인하고 다시 시도해 주세요. (답안은 기기에 저장되어 있습니다)","err");});}
/* 소단원 전체 퀴즈 제출: 기존 시트 구조 유지를 위해 차시별로 나눠 기록 */
function sendParts(id,sels){if(ENDPOINT.indexOf("http")!==0){setStat("제출 주소가 설정되지 않았습니다.","err");return;}setStat("제출 중...","");var tot=0;
 Promise.all(L.parts.map(function(pt){var a=sels.slice(pt.from,pt.from+pt.n),sc=0;a.forEach(function(v,i){if(v!==""&&+v-1===L.mc[pt.from+i].a)sc++;});tot+=sc;
  return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"quiz",lesson:pt.code,sid:id.sid,name:id.name,score:sc,total:pt.n,answers:a})}).then(function(r){return r.json();});}))
 .then(function(js){if(js.every(function(j){return j&&j.ok;}))setStat("점수 "+tot+" / "+L.mc.length+" · 제출 완료 ("+new Date().toLocaleTimeString("ko-KR")+"). 다시 제출하면 최신 내용으로 바뀝니다.","ok");else{var j=js.filter(function(j){return!(j&&j.ok);})[0];setStat("제출 실패: "+(j&&j.error||"알 수 없는 오류")+" · 다시 시도해 주세요.","err");}})
 .catch(function(){setStat("제출 실패: 네트워크를 확인하고 다시 시도해 주세요. (답안은 기기에 저장되어 있습니다)","err");});}
document.addEventListener("click",function(e){var t=e.target;if(!L)return;var k=L.code;
 if(t.id==="tab-ws"){tab="ws";render();return;}if(t.id==="tab-qz"){tab="qz";render();return;}
 if(t.id==="submit-ws"){var id=ident();if(!id)return;var ans=L.qs.map(function(q,qi){return(document.getElementById("a-"+k+"-"+qi).value||"").trim();});
  if(ans.every(function(a){return!a;})&&!confirm("작성한 답안이 없습니다. 그래도 제출할까요?"))return;
  send({type:"ws",lesson:k,sid:id.sid,name:id.name,qs:L.qs.map(function(q){return q.q;}),answers:ans});return;}
 if(t.id==="copy-ws"){var id2=ident();if(!id2)return;var out="["+L.label+" "+L.title+"] 학번 "+id2.sid+" / 이름 "+id2.name+"\n";L.qs.forEach(function(q,qi){out+="\n"+(qi+1)+". "+q.q+"\n→ "+(document.getElementById("a-"+k+"-"+qi).value||"(미작성)")+"\n";});
  try{navigator.clipboard.writeText(out).then(function(){setStat("복사했어요.","ok");},function(){setStat("복사가 막혔어요.","err");});}catch(x){setStat("복사가 막혔어요.","err");}return;}
 if(t.id==="retry"){L.mc.forEach(function(m,mi){ls("m-"+k+"-"+mi,"");});render();return;}
 if(t.id==="grade"){var id3=ident();if(!id3)return;var ok=0,sels=[];
  L.mc.forEach(function(m,mi){var nm="m-"+k+"-"+mi,f=document.getElementById("f-"+nm),c=f.querySelector("input:checked"),fb=f.querySelector(".fb");f.classList.remove("ok","no");
   if(!c){sels.push("");fb.innerHTML='<span class="v">답을 고르지 않았어요.</span>';return;}
   sels.push(+c.value+1);var r=+c.value===m.a;if(r)ok++;f.classList.add(r?"ok":"no");fb.innerHTML='<span class="v">'+(r?"정답!":"아쉬워요. 정답은 "+"①②③④"[m.a])+'</span> '+esc(m.e);});
  if(L.sec){sendParts(id3,sels);return;}
  send({type:"quiz",lesson:k,sid:id3.sid,name:id3.name,score:ok,total:L.mc.length,answers:sels});}
});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.k)ls(t.dataset.k,t.value);if(t.type==="radio")ls(t.name,t.value);});
render();
</script></body></html>
